<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Thiago Cavalcante</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2933;
      background: #f7f8fa;
      line-height: 1.65;
    }

    .site {
      display: flex;
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px;
      gap: 44px;
    }

    .sidebar {
      width: 230px;
      flex-shrink: 0;
      position: sticky;
      top: 36px;
      align-self: flex-start;
      padding: 24px 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
    }

    .sidebar h1 {
      font-size: 1.3rem;
      margin: 0;
      line-height: 1.3;
      color: #111827;
    }

    .sidebar .position {
      margin: 10px 0 1px;
      color: #4b5563;
      font-size: 0.95rem;
    }

    .sidebar .affiliation {
      margin: 0 0 22px;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .sidebar nav {
      border-top: 1px solid #eceff1;
      padding-top: 16px;
    }

    .sidebar nav a {
      display: block;
      margin: 8px 0;
      padding: 7px 0;
      text-decoration: none;
      color: #2f5d7c;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .sidebar nav a:hover {
      color: #173f5f;
    }

    .content {
      flex: 1;
      min-width: 0;
      max-width: 840px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 38px 42px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
    }

    .content h1,
    .content h2,
    .content h3 {
      color: #111827;
      line-height: 1.3;
    }

    .content h1 {
      margin-top: 0;
    }

    .content h2 {
      margin-top: 46px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #dfe3e8;
      font-size: 1.45rem;
    }

    .content h2:first-child {
      margin-top: 0;
    }

    .content h3 {
      margin-top: 30px;
      margin-bottom: 14px;
      font-size: 1.05rem;
      color: #4b5563;
    }

    .content ol {
      padding-left: 1.4rem;
    }

    .content li {
      margin-bottom: 22px;
      padding-left: 4px;
    }

    .content a {
      color: #2f5d7c;
      text-decoration: none;
      font-weight: 600;
    }

    .content a:hover {
      text-decoration: underline;
    }

    .content em {
      color: #374151;
    }

    @media (max-width: 800px) {
      .site {
        display: block;
        padding: 20px 14px;
      }

      .sidebar {
        width: auto;
        position: static;
        margin-bottom: 20px;
      }

      .sidebar nav a {
        display: inline-block;
        margin-right: 16px;
      }

      .content {
        padding: 26px 20px;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <aside class="sidebar">
      <h1>Thiago Cavalcante</h1>
      <p class="position">Postdoctoral Researcher</p>
      <p class="affiliation">University of Helsinki</p>

      <nav>
        <a href="#peer-reviewed-scientific-articles">Peer-reviewed Articles</a>
        <a href="#preprints">Preprints</a>
      </nav>
    </aside>

    <main class="content">
      {{ content }}
    </main>

  </div>

</body>
</html>
