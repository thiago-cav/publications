<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Thiago Cavalcante</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.6;
    }

    .site {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      gap: 48px;
    }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 30px;
      align-self: flex-start;
    }

    .sidebar h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
    }

    .sidebar p {
      color: #666;
      margin: 0 0 24px;
    }

    .sidebar nav a {
      display: block;
      margin: 10px 0;
      text-decoration: none;
      color: #0366d6;
      font-weight: 600;
    }

    .sidebar nav a:hover {
      text-decoration: underline;
    }

    .content {
      flex: 1;
      min-width: 0;
      max-width: 820px;
    }

    .content h1 {
      margin-top: 0;
    }

    .content h2 {
      margin-top: 48px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    .content h3 {
      margin-top: 32px;
    }

    .content a {
      color: #0366d6;
    }

    @media (max-width: 800px) {
      .site {
        display: block;
        padding: 24px 18px;
      }

      .sidebar {
        width: auto;
        position: static;
        margin-bottom: 36px;
      }

      .sidebar nav a {
        display: inline-block;
        margin-right: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <aside class="sidebar">
      <h1>Thiago Cavalcante</h1>
      <p>Scientific Publications</p>

      <nav>
        <a href="#peer-reviewed-scientific-articles">Peer-reviewed Articles</a>
        <a href="#preprints">Preprints</a>
      </nav>
    </aside>

    <main class="content">
      {{ content }}
    </main>

  </div>

</body>
</html>
